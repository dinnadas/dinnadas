name: Routine Update

on:
  schedule:
    - cron: '3 21 * * *'

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Generate content and update file
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<EOF
          import openai
          import datetime

          client = openai.OpenAI()

          response = client.chat.completions.create(
              model="gpt-4o-mini",
              messages=[
                  {"role": "system", "content": "You are a helpful assistant."},
                  {"role": "user", "content": "Generate a short, neutral daily note or fact for a log file."}
              ]
          )
          content = response.choices[0].message.content.strip()

          today = datetime.date.today().isoformat()
          with open('daily-log.md', 'a') as f:
              f.write(f"## {today}\n{content}\n\n")
          EOF

      - name: Commit changes if any
        run: |
          git config --global user.name "Repo Bot"
          git config --global user.email "noreply@github.com"
          git add daily-log.md
          git commit -m "chore: routine update" || echo "No changes to commit"
          git push
